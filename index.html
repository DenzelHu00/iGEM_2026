VCqsnmVz/6ANAsdobSCBx/6bZRMU8RmBBqimpl1fk//2Q==\" alt=\"Thousands of iGEM participants with their hands raised at the iGEM Grand Jamboree\" style=\"width:100%;height:auto;display:block\">\n          <\u002Fdiv>\n          <figcaption style=\"font-size:13px;line-height:1.5;margin:10px 0 0;color:color-mix(in srgb, var(--color-text) 60%, transparent)\">The global iGEM community at the Grand Jamboree.<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ true }}\">\n  <main>\n    <section style=\"max-width:1180px;margin:0 auto;padding:clamp(44px,6vw,84px) clamp(20px,5vw,72px) clamp(28px,4vw,48px)\">\n      <h1 style=\"font-family:var(--font-heading);font-size:clamp(34px,4.6vw,58px);line-height:1.1;letter-spacing:-0.02em;margin:0 0 24px;max-width:20ch;text-wrap:balance\">Tell us what it was actually like<\u002Fh1>\n      <p style=\"font-size:18px;line-height:1.65;max-width:60ch;margin:0;color:color-mix(in srgb, var(--color-text) 84%, transparent)\">Pick whichever way suits you. There are no wrong answers here, you can stop whenever you want, and you never have to give us your name.<\u002Fp>\n    <\u002Fsection>\n\n    <section style=\"max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,72px) clamp(40px,6vw,72px);display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:clamp(32px,4vw,72px);align-items:start\">\n\n      <div>\n        <sc-if value=\"{{ sent }}\">\n          <div style=\"background:var(--color-accent-2-100);border-radius:44px;padding:clamp(28px,4vw,44px)\">\n            <h2 style=\"font-family:var(--font-heading);font-size:26px;line-height:1.2;margin:0 0 12px\">Thank you. That’s with us.<\u002Fh2>\n            <p style=\"font-size:16px;line-height:1.7;margin:0 0 22px;max-width:44ch;color:color-mix(in srgb, var(--color-text) 84%, transparent)\">One of the six of us will write back within a few days. If you gave us an email, that’s where it’ll go.<\u002Fp>\n            <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ reset }}\" style=\"padding:10px 20px;font-size:15px\">Send another<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n        <form sc-camel-on-submit=\"{{ submit }}\" style=\"display:grid;gap:20px;max-width:520px\">\n          <fieldset style=\"border:0;padding:0;margin:0;display:grid;gap:12px\">\n            <legend style=\"font-family:var(--font-heading);font-size:20px;padding:0;margin:0 0 6px\">How would you like to take part?<\u002Flegend>\n            <label class=\"radio\" style=\"align-items:flex-start;gap:12px;font-size:15.5px;line-height:1.5\">\n              <input type=\"radio\" name=\"mode\" value=\"survey\" checked=\"{{ modeSurvey }}\" sc-camel-on-change=\"{{ setMode }}\">\n              <span class=\"dot\" style=\"margin-top:4px\"><\u002Fspan>\n              <span><strong style=\"font-weight:700\">A short survey<\u002Fstrong><br><span style=\"color:color-mix(in srgb, var(--color-text) 72%, transparent)\">About ten minutes, completely anonymous.<\u002Fspan><\u002Fspan>\n            <\u002Flabel>\n            <label class=\"radio\" style=\"align-items:flex-start;gap:12px;font-size:15.5px;line-height:1.5\">\n              <input type=\"radio\" name=\"mode\" value=\"interview\" checked=\"{{ modeInterview }}\" sc-camel-on-change=\"{{ setMode }}\">\n              <span class=\"dot\" style=\"margin-top:4px\"><\u002Fspan>\n              <span><strong style=\"font-weight:700\">A one-to-one conversation<\u002Fstrong><br><span style=\"color:color-mix(in srgb, var(--color-text) 72%, transparent)\">Thirty to forty-five minutes, online or in person in Vancouver.<\u002Fspan><\u002Fspan>\n            <\u002Flabel>\n            <label class=\"radio\" style=\"align-items:flex-start;gap:12px;font-size:15.5px;line-height:1.5\">\n              <input type=\"radio\" name=\"mode\" value=\"written\" checked=\"{{ modeWritten }}\" sc-camel-on-change=\"{{ setMode }}\">\n              <span class=\"dot\" style=\"margin-top:4px\"><\u002Fspan>\n              <span><strong style=\"font-weight:700\">Write it in your own words<\u002Fstrong><br><span style=\"color:color-mix(in srgb, var(--color-text) 72%, transparent)\">As long or as short as you like, anonymously.<\u002Fspan><\u002Fspan>\n            <\u002Flabel>\n            <label class=\"radio\" style=\"align-items:flex-start;gap:12px;font-size:15.5px;line-height:1.5\">\n              <input type=\"radio\" name=\"mode\" value=\"updates\" checked=\"{{ modeUpdates }}\" sc-camel-on-change=\"{{ setMode }}\">\n              <span class=\"dot\" style=\"margin-top:4px\"><\u002Fspan>\n              <span><strong style=\"font-weight:700\">Nothing yet, just keep me posted<\u002Fstrong><br><span style=\"color:color-mix(in srgb, var(--color-text) 72%, transparent)\">We’ll email when there’s something to read.<\u002Fspan><\u002Fspan>\n            <\u002Flabel>\n          <\u002Ffieldset>\n\n          <div class=\"field\">\n            <label for=\"lwr-name\" style=\"font-size:13px\">Name <span style=\"opacity:0.7\">(optional, leave it blank if you’d rather)<\u002Fspan><\u002Flabel>\n            <input class=\"input\" id=\"lwr-name\" type=\"text\" value=\"{{ fname }}\" sc-camel-on-change=\"{{ setName }}\" placeholder=\"What should we call you?\">\n          <\u002Fdiv>\n\n          <div class=\"field\">\n            <label for=\"lwr-email\" style=\"font-size:13px\">Email<\u002Flabel>\n            <input class=\"input\" id=\"lwr-email\" type=\"email\" required=\"{{ true }}\" value=\"{{ femail }}\" sc-camel-on-change=\"{{ setEmail }}\" placeholder=\"you@example.com\">\n          <\u002Fdiv>\n\n          <div class=\"field\">\n            <label for=\"lwr-msg\" style=\"font-size:13px\">Anything you want us to know <span style=\"opacity:0.7\">(optional)<\u002Fspan><\u002Flabel>\n            <textarea class=\"input\" id=\"lwr-msg\" rows=\"4\" value=\"{{ fmsg }}\" sc-camel-on-change=\"{{ setMsg }}\" placeholder=\"A sentence, a paragraph, or a question for us.\" style=\"border-radius:24px;padding:12px 16px\"><\u002Ftextarea>\n          <\u002Fdiv>\n\n          <label style=\"display:grid;grid-template-columns:18px 1fr;gap:12px;align-items:start;font-size:14.5px;line-height:1.6;color:color-mix(in srgb, var(--color-text) 82%, transparent);cursor:pointer\">\n            <input type=\"checkbox\" checked=\"{{ fconsent }}\" sc-camel-on-change=\"{{ setConsent }}\" style=\"width:18px;height:18px;margin:2px 0 0;accent-color:var(--color-accent)\">\n            <span>I’ve read how my information will be handled and I’m happy to be contacted about this study.<\u002Fspan>\n          <\u002Flabel>\n\n          <div>\n            <button type=\"submit\" class=\"btn btn-primary\" style=\"padding:12px 26px;font-size:15px\">Send this to the team<\u002Fbutton>\n          <\u002Fdiv>\n          <p style=\"font-size:13.5px;line-height:1.6;margin:0;color:color-mix(in srgb, var(--color-text) 66%, transparent)\">This form is a draft and isn’t connected to anything yet. For now, please email us directly.<\u002Fp>\n        <\u002Fform>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;gap:clamp(24px,3vw,36px)\">\n        <div>\n          <h2 style=\"font-family:var(--font-heading);font-size:22px;line-height:1.25;margin:0 0 14px\">Or just write to us<\u002Fh2>\n          <p style=\"font-size:16px;line-height:1.7;margin:0 0 6px\"><a href=\"mailto:humanpractices@ubcigem.com\">humanpractices@ubcigem.com<\u002Fa><\u002Fp>\n          <p style=\"font-size:16px;line-height:1.7;margin:0 0 6px\"><a href=\"https://www.instagram.com/ubcigem/\" target=\"_blank\" rel=\"noreferrer\">@ubcigem on Instagram<\u002Fa><\u002Fp>\n        <\u002Fdiv>\n\n        <div>\n          <h2 style=\"font-family:var(--font-heading);font-size:22px;line-height:1.25;margin:0 0 14px\">Who we’d like to hear from<\u002Fh2>\n          <ul style=\"list-style:none;margin:0;padding:0;display:grid;gap:12px\">\n            <li style=\"display:grid;grid-template-columns:12px 1fr;gap:12px;align-items:start;font-size:15.5px;line-height:1.6;color:color-mix(in srgb, var(--color-text) 82%, transparent)\"><span aria-hidden=\"true\" style=\"width:12px;height:12px;border-radius:50%;background:var(--color-accent);margin-top:6px\"><\u002Fspan><span>You’ve had, or currently have, an infection that didn’t respond to the usual antibiotics.<\u002Fspan><\u002Fli>\n            <li style=\"display:grid;grid-template-columns:12px 1fr;gap:12px;align-items:start;font-size:15.5px;line-height:1.6;color:color-mix(in srgb, var(--color-text) 82%, transparent)\"><span aria-hidden=\"true\" style=\"width:12px;height:12px;border-radius:50%;background:var(--color-accent-2-500);margin-top:6px\"><\u002Fspan><span>You’ve looked after somebody who has, whether as family, a partner or a friend.<\u002Fspan><\u002Fli>\n            <li style=\"display:grid;grid-template-columns:12px 1fr;gap:12px;align-items:start;font-size:15.5px;line-height:1.6;color:color-mix(in srgb, var(--color-text) 82%, transparent)\"><span aria-hidden=\"true\" style=\"width:12px;height:12px;border-radius:50%;background:var(--color-accent);margin-top:6px\"><\u002Fspan><span>You’ve been on antibiotics for months rather than days.<\u002Fspan><\u002Fli>\n            <li style=\"display:grid;grid-template-columns:12px 1fr;gap:12px;align-items:start;font-size:15.5px;line-height:1.6;color:color-mix(in srgb, var(--color-text) 82%, transparent)\"><span aria-hidden=\"true\" style=\"width:12px;height:12px;border-radius:50%;background:var(--color-accent-2-500);margin-top:6px\"><\u002Fspan><span>You treat these infections for a living and see this side of them.<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ showEthics }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,72px) clamp(56px,8vw,104px)\">\n      <div style=\"background:var(--color-surface);border-radius:56px;padding:clamp(32px,5vw,56px) clamp(24px,4vw,60px);display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(28px,4vw,64px)\">\n        <div>\n          <h2 style=\"font-family:var(--font-heading);font-size:clamp(22px,2.2vw,27px);line-height:1.2;margin:0 0 14px;max-width:20ch;text-wrap:balance\">What you tell us stays yours<\u002Fh2>\n          <p style=\"font-size:15.5px;line-height:1.7;margin:0 0 14px;max-width:48ch;color:color-mix(in srgb, var(--color-text) 84%, transparent)\">Nothing is ever published with your name on it. Before anyone outside the interview team reads a transcript, we take out the details that could identify you: places, employers, hospitals, dates.<\u002Fp>\n          <p style=\"font-size:15.5px;line-height:1.7;margin:0;max-width:48ch;color:color-mix(in srgb, var(--color-text) 84%, transparent)\">If you’d rather not be recorded, we take notes instead. If a question feels like too much, skip it; nobody will ask you why.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <h2 style=\"font-family:var(--font-heading);font-size:clamp(22px,2.2vw,27px);line-height:1.2;margin:0 0 14px;max-width:20ch;text-wrap:balance\">Your data, your call<\u002Fh2>\n          <p style=\"font-size:15.5px;line-height:1.7;margin:0 0 14px;max-width:48ch;color:color-mix(in srgb, var(--color-text) 84%, transparent)\">Recordings and transcripts are kept on encrypted university systems that only this subteam can open. They are deleted once the project is written up.<\u002Fp>\n          <p style=\"font-size:15.5px;line-height:1.7;margin:0 0 16px;max-width:48ch;color:color-mix(in srgb, var(--color-text) 84%, transparent)\">You can ask us to pull your contribution out at any time before we publish. No reason needed, no follow-up questions, and it changes nothing about your care.<\u002Fp>\n          <p style=\"font-size:14px;line-height:1.6;margin:0;max-width:48ch;padding:14px 18px;border-radius:24px;background:var(--color-accent-100);color:var(--color-accent-800)\">Placeholder: add the UBC research ethics approval number, the withdrawal deadline and a named contact once approval comes through.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <\u002Fsc-if>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <footer style=\"max-width:1180px;margin:0 auto;padding:clamp(28px,4vw,44px) clamp(20px,5vw,72px) clamp(40px,5vw,64px);border-top:1px solid var(--color-divider);display:flex;flex-wrap:wrap;gap:14px 32px;align-items:baseline;font-size:13.5px;line-height:1.7;color:color-mix(in srgb, var(--color-text) 66%, transparent)\">\n    <span style=\"display:flex;align-items:center;gap:12px\"><img src=\"58e4314a-bfc3-4892-87ad-92d9dd65a4dc\" alt=\"\" style=\"height:30px;width:auto;display:block;flex:none;opacity:0.7\">iGEM UBC 2026 · Human Practices · Vancouver, BC<\u002Fspan>\n    <span style=\"align-self: center\">Not medical advice. If you’re unwell, contact your care team.<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;projectName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;PATH-AMR&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Identity&quot;},&quot;heroShapeColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;var(--color-accent-2-200)&quot;,&quot;options&quot;:[&quot;var(--color-accent-2-200)&quot;,&quot;var(--color-accent-200)&quot;,&quot;var(--color-accent-2-300)&quot;,&quot;var(--color-neutral-200)&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Identity&quot;},&quot;teamPhotoShape&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;circle&quot;,&quot;rounded&quot;],&quot;default&quot;:&quot;rounded&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Team page&quot;},&quot;showEthics&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Contact page&quot;}}\">\nconst TABS = ['overview', 'goals', 'stories', 'team', 'contact'];\n\nconst STORIES = [\n  {\n    quote: \"The hardest part wasn't the infection itself. It was the isolation room — eight days behind a closed door, watching people hesitate at the glass before they came in.\",\n    name: \"Anonymous\",\n    context: \"Living with a resistant MRSA infection\",\n    seed: [\n      { author: \"iGEM UBC team\", text: \"Thank you for trusting us with this. The isolation piece comes up again and again in what we've read.\" }\n    ]\n  },\n  {\n    quote: \"No one could tell us how long it would last, or whether it would come back. We learned to live inside that question mark.\",\n    name: \"Anonymous\",\n    context: \"Caregiver and partner of a patient\",\n    seed: [\n      { author: \"Community member\", text: \"This is exactly what my family went through. You are not alone in it.\" }\n    ]\n  },\n  {\n    quote: \"After two years of antibiotics I still couldn't explain my own diagnosis to my family — because no one had ever really explained it to me.\",\n    name: \"Anonymous\",\n    context: \"Long-term antibiotic treatment\",\n    seed: [\n      { author: \"iGEM UBC team\", text: \"‘Nobody told me’ is one of the barriers we most want to change. Thank you for sharing it.\" }\n    ]\n  },\n  {\n    long: true,\n    title: \"What eighteen months of treatment actually looked like\",\n    paragraphs: [\n      \"It started with what everyone assumed was a simple urinary tract infection. The first antibiotic didn't touch it. Neither did the second. By the time a culture came back naming the organism, I had already spent three weeks feeling like I was getting worse while being told to finish the course and wait.\",\n      \"The hardest stretch wasn't the illness itself — it was everything around it. I stopped being able to plan more than a week ahead. I turned down a job because I couldn't promise I'd be well enough to start it. Friends drifted, not out of unkindness, but because “still sick” is a hard thing to hold onto for months at a time. I became an expert in my own bloodwork and a stranger to my own calendar.\",\n      \"What I wish someone had told me early on is that this is common enough that there are words for it, and that the exhaustion and the isolation aren't a personal failing. I'm sharing this because when I was in the middle of it, I couldn't find a single account that sounded like mine. If yours sounds like this too, you are not the only one.\"\n    ],\n    name: \"Anonymous\",\n    context: \"Recurrent resistant UTI · 18 months of treatment\",\n    seed: [\n      { author: \"iGEM UBC team\", text: \"Thank you for writing all of this out — ‘a stranger to my own calendar’ is exactly the kind of thing this project exists to surface.\" }\n    ]\n  }\n];\n\nconst STORY_PREVIEW_LIMIT = 300;\nfunction makePreview(text, limit) {\n  if (text.length <= limit) return text;\n  let cut = text.slice(0, limit);\n  const sp = cut.lastIndexOf(' ');\n  if (sp > limit * 0.6) cut = cut.slice(0, sp);\n  return cut.replace(/[\\s.,;:—-]+$/, '') + '…';\n}\n\nclass Component extends DCLogic {\n  state = { tab: 'overview', sent: false, name: '', email: '', msg: '', mode: 'survey', consent: false,\n    comments: STORIES.map((s) => s.seed.slice()),\n    drafts: STORIES.map(() => ({ name: '', text: '' })),\n    open: STORIES.map(() => false),\n    expanded: STORIES.map(() => false) };\n\n  setDraft(i, field, value) {\n    const drafts = this.state.drafts.map((d, k) => k === i ? { ...d, [field]: value } : d);\n    this.setState({ drafts });\n  }\n\n  postComment(i) {\n    const draft = this.state.drafts[i] || { name: '', text: '' };\n    const text = (draft.text || '').trim();\n    if (!text) return;\n    const author = (draft.name || '').trim() || 'Anonymous';\n    const comments = this.state.comments.map((list, k) => k === i ? [...list, { author, text }] : list);\n    const drafts = this.state.drafts.map((d, k) => k === i ? { name: '', text: '' } : d);\n    this.setState({ comments, drafts });\n  }\n\n  toggleStory(i) {\n    const open = this.state.open.map((v, k) => k === i ? !v : v);\n    this.setState({ open });\n  }\n\n  toggleExpand(i) {\n    const expanded = this.state.expanded.map((v, k) => k === i ? !v : v);\n    this.setState({ expanded });\n  }\n\n  componentDidMount() {\n    this._onHash = () => this.readHash();\n    window.addEventListener('hashchange', this._onHash);\n    this.readHash();\n  }\n  componentWillUnmount() { window.removeEventListener('hashchange', this._onHash); }\n\n  readHash() {\n    const h = (window.location.hash || '').replace('#', '');\n    if (TABS.includes(h) && h !== this.state.tab) this.setState({ tab: h });\n  }\n\n  go(tab) {\n    this.setState({ tab });\n    try { window.history.replaceState(null, '', '#' + tab); } catch (e) { /* sandboxed */ }\n    try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { window.scrollTo(0, 0); }\n  }\n\n  tabStyle(tab) {\n    const on = this.state.tab === tab;\n    return {\n      bg: on ? 'var(--color-accent-200)' : 'transparent',\n      ink: on ? 'var(--color-accent-800)' : 'color-mix(in srgb, var(--color-text) 78%, transparent)'\n    };\n  }\n\n  renderVals() {\n    const ov = this.tabStyle('overview'), go = this.tabStyle('goals'),\n          te = this.tabStyle('team'), co = this.tabStyle('contact');\n    const st = this.tabStyle('stories');\n    const shape = this.props.teamPhotoShape ?? 'circle';\n    return {\n      brandName: this.props.projectName ?? 'PATH-AMR',\n      shapeColor: this.props.heroShapeColor ?? 'var(--color-accent-2-200)',\n      photoRadius: shape === 'circle' ? '50%' : '28px',\n      showEthics: this.props.showEthics ?? true,\n\n      isOverview: this.state.tab === 'overview',\n      isStories: this.state.tab === 'stories',\n      isGoals: this.state.tab === 'goals',\n      isTeam: this.state.tab === 'team',\n      isContact: this.state.tab === 'contact',\n\n      ovBg: ov.bg, ovInk: ov.ink, goBg: go.bg, goInk: go.ink,\n      teBg: te.bg, teInk: te.ink, coBg: co.bg, coInk: co.ink,\n      stBg: st.bg, stInk: st.ink,\n\n      goOverview: () => this.go('overview'),\n      goStories: () => this.go('stories'),\n      stories: STORIES.map((s, i) => {\n        const list = this.state.comments[i] || [];\n        const draft = this.state.drafts[i] || { name: '', text: '' };\n        const full = (s.paragraphs || []).join(' ');\n        const needsTrunc = !!s.long && full.length > STORY_PREVIEW_LIMIT;\n        const isExpanded = this.state.expanded[i];\n        return {\n          quote: s.quote || '', name: s.name, context: s.context,\n          isShort: !s.long, isLong: !!s.long, title: s.title || '', paragraphs: s.paragraphs || [],\n          showPreview: needsTrunc && !isExpanded,\n          showFull: !needsTrunc || isExpanded,\n          canCollapse: needsTrunc && isExpanded,\n          preview: needsTrunc ? makePreview(full, STORY_PREVIEW_LIMIT) : full,\n          expandLabel: isExpanded ? '▴ Show less' : '▾ Read the full story',\n          onExpand: () => this.toggleExpand(i),\n          comments: list,\n          countLabel: list.length === 1 ? '1 comment' : list.length + ' comments',\n          open: this.state.open[i],\n          toggleLabel: this.state.open[i] ? '▾ Hide comments' : ('▸ ' + (list.length === 1 ? '1 comment' : list.length + ' comments')),\n          onToggle: () => this.toggleStory(i),\n          draftName: draft.name,\n          draftText: draft.text,\n          onDraftName: (e) => this.setDraft(i, 'name', e.target.value),\n          onDraftText: (e) => this.setDraft(i, 'text', e.target.value),\n          onPost: (e) => { e.preventDefault(); this.postComment(i); }\n        };\n      }),\n      goGoals: () => this.go('goals'),\n      goTeam: () => this.go('team'),\n      goContact: () => this.go('contact'),\n\n      sent: this.state.sent,\n      notSent: !this.state.sent,\n      fname: this.state.name,\n      femail: this.state.email,\n      fmsg: this.state.msg,\n      fconsent: this.state.consent,\n      modeSurvey: this.state.mode === 'survey',\n      modeInterview: this.state.mode === 'interview',\n      modeWritten: this.state.mode === 'written',\n      modeUpdates: this.state.mode === 'updates',\n\n      setName: (e) => this.setState({ name: e.target.value }),\n      setEmail: (e) => this.setState({ email: e.target.value }),\n      setMsg: (e) => this.setState({ msg: e.target.value }),\n      setMode: (e) => this.setState({ mode: e.target.value }),\n      setConsent: (e) => this.setState({ consent: e.target.checked }),\n      submit: (e) => { e.preventDefault(); this.setState({ sent: true }); },\n      reset: () => this.setState({ sent: false, name: '', email: '', msg: '', consent: false })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
