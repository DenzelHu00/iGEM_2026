document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px ider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* ction:column;line-height:1.2\"><span>{{ brandName }}<\u002Fspan><span style=\"font-size:11px;font-weight:500;letter-spacing:0.01em;color:color-mix(in srgb, var(--color-text) 60%, transparent)\">Psychosocial And Treatment Hurdles in AMR<\u002Fspan><\u002Fspan>\n    <\u002Fspan>\n    <nav style=\"display:flex;gap:4px;flex-wrap:nowrap\" aria-label=\"Sections\">\n      <button type=\"button\" sc-camel-on-click=\"{{ goOverview }}\" style=\"font-family:var(--font-body);font-size:13.5px;font-weight:600;border:0;cursor:pointer;padding:7px 12px;border-radius:999px;white-space:nowrap;background:{{ ovBg }};color:{{ ovInk }}\" style-hover=\"opacity:0.85\">Overview<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ goGoals }}\" style=\"font-family:var(--font-body);font-size:13.5px;font-weight:600;border:0;cursor:pointer;padding:7px 12px;border-radius:999px;white-space:nowrap;background:{{ goBg }};color:{{ goInk }}\" style-hover=\"opacity:0.85\">Goals &amp; mission<\u002Fbutton>\n      <button type=\"button\" onClick=\"{{ goStories }}\" style=\"font-family:var(--font-body);font-size:13.5px;font-weight:600;border:0;cursor:pointer;padding:7px 12px;border-radius:999px;white-space:nowrap;background:{{ stBg }};color:{{ stInk }}\" style-hover=\"opacity:0.85\">Patient stories<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ goTeam }}\" style=\"font-family:var(--font-body);font-size:13.5px;font-weight:600;border:0;cursor:pointer;padding:7px 12px;border-radius:999px;white-space:nowrap;background:{{ teBg }};color:{{ teInk }}\" style-hover=\"opacity:0.85\">Our team<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ goContact }}\" style=\"font-family:var(--font-body);font-size:13.5px;font-weight:600;border:0;cursor:pointer;padding:7px 12px;border-radius:999px;white-space:nowrap;background:{{ coBg }};color:{{ coInk }}\" style-hover=\"opacity:0.85\">Contact us<\u002Fbutton>\n    <\u002Fnav>\n    <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ goContact }}\" style=\"padding:10px 20px;font-size:15px\">Share your experience<\u002Fbutton>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ true }}\">\n  <main>\n    <section style=\"position:relative;max-width:1180px;margin:0 auto;padding:clamp(44px,7vw,96px) clamp(20px,5vw,72px) clamp(32px,5vw,64px)\">\n      <div aria-hidden=\"true\" style=\"position:absolute;right:-40px;top:-180px;width:440px;height:440px;border-radius:50%;background:{{ shapeColor }};z-index:0;pointer-events:none\"><\u002Fdiv>\n      <div style=\"position:relative;z-index:1\">\n        <h1 style=\"font-family:var(--font-heading);font-size:clamp(36px,5.2vw,68px);line-height:1.08;letter-spacing:-0.02em;margin:0 0 26px;max-width:20ch;text-wrap:balance\">Some of the hardest parts of an infection aren’t medical.<\u002Fh1>\n        <p style=\"font-size:18px;line-height:1.65;max-width:60ch;margin:0;color:color-mix(in srgb, var(--color-text) 84%, transparent)\">We’re a student team at the University of British Columbia listening to people living with antibiotic‑resistant infections, and to the families, caregivers and clinicians around them. The science is well studied. What it does to a life is not. That’s the part we’re asking about.<\u002Fp>\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:32px\">\n          <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ goContact }}\" style=\"padding:12px 24px;font-size:15px\">Share your experience<\u002Fbutton>\n          <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goGoals }}\" style=\"padding:12px 24px;font-size:15px\">What we’re trying to do<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"max-width:1180px;margin:0 auto;padding:clamp(32px,5vw,64px) clamp(20px,5vw,72px)\">\n      <h2 style=\"font-family:var(--font-heading);font-size:clamp(26px,3vw,38px);line-height:1.15;margin:0 0 8px;max-width:22ch;text-wrap:balance\">First, in plain language<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.65;max-width:56ch;margin:0 0 clamp(28px,4vw,48px);color:color-mix(in srgb, var(--color-text) 72%, transparent)\">No background needed. If you already know all of this, skip ahead.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(28px,4vw,56px)\">\n        <div>\n          <h3 style=\"font-family:var(--font-heading);font-size:22px;line-height:1.25;margin:0 0 12px\">What resistance means<\u002Fh3>\n          <p style=\"font-size:16px;line-height:1.7;margin:0;color:color-mix(in srgb, var(--color-text) 82%, transparent)\">Antibiotics are medicines that kill bacteria. In any group of bacteria, a few already survive a given drug. Antibiotics clear out the rest, and the survivors are what’s left to multiply. That’s resistance: not a bug that turned nasty because of something you did, and not a punishment for taking medicine you needed.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"font-family:var(--font-heading);font-size:22px;line-height:1.25;margin:0 0 12px\">It usually still works<\u002Fh3>\n          <p style=\"font-size:16px;line-height:1.7;margin:0;color:color-mix(in srgb, var(--color-text) 82%, transparent)\">Almost all of the time, antibiotics do their job, partly because doctors keep other options in reserve for when the first one fails. Antibiotics are arguably the most important medicine ever made; without them there would be no transplants, no routine surgery. Resistance is what makes protecting them urgent, not a reason to fear them.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"font-family:var(--font-heading);font-size:22px;line-height:1.25;margin:0 0 12px\">When it doesn’t<\u002Fh3>\n          <p style=\"font-size:16px;line-height:1.7;margin:0;color:color-mix(in srgb, var(--color-text) 82%, transparent)\">An infection that should clear in a week drags on for months, needs harsher drugs, or keeps coming back. That means more appointments, more waiting, more time away from work and people, and sometimes an isolation room, or being asked to keep your distance from your own family.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"font-family:var(--font-heading);font-size:22px;line-height:1.25;margin:0 0 12px\">And “psychosocial”?<\u002Fh3>\n          <p style=\"font-size:16px;line-height:1.7;margin:0;color:color-mix(in srgb, var(--color-text) 82%, transparent)\">A clunky word for an ordinary thing: how an illness lands on your mood, your relationships, your work and your sense of yourself. Hospitals measure the infection closely. Far fewer people ask about the rest of it.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:15px;line-height:1.7;margin:clamp(24px,3vw,36px) 0 0;max-width:62ch;padding:16px 22px;border-radius:28px;background:var(--color-accent-2-100);color:color-mix(in srgb, var(--color-text) 86%, transparent)\"><strong style=\"font-weight:700\">A note on words.<\u002Fstrong> You may have heard “antibiotic resistance” or “superbug”. Researchers say <em>antimicrobial resistance<\u002Fem>, or AMR, because it covers more than bacteria and more than one mechanism. We use that term here, but use whichever words feel natural when you talk to us.<\u002Fp>\n    <\u002Fsection>\n\n    <section style=\"max-width:1180px;margin:0 auto;padding:clamp(32px,5vw,64px) clamp(20px,5vw,72px)\">\n      <div style=\"background:var(--color-surface);border-radius:56px;padding:clamp(32px,5vw,56px) clamp(24px,4vw,60px)\">\n        <h2 style=\"font-family:var(--font-heading);font-size:clamp(24px,2.6vw,32px);line-height:1.18;margin:0 0 10px;max-width:26ch;text-wrap:balance\">You are much less alone in this than it feels<\u002Fh2>\n        <p style=\"font-size:16px;line-height:1.7;margin:0 0 clamp(26px,3vw,40px);max-width:56ch;color:color-mix(in srgb, var(--color-text) 78%, transparent)\">A few numbers, because people often assume this is rare or unusual.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:clamp(24px,3vw,44px)\">\n          <div>\n            <p style=\"font-family:var(--font-heading);font-size:clamp(34px,4vw,48px);line-height:1;margin:0 0 10px;color:var(--color-accent-700)\">1 in 5<\u002Fp>\n            <p style=\"font-size:15px;line-height:1.6;margin:0;color:color-mix(in srgb, var(--color-text) 80%, transparent)\">Canadians surveyed said they or someone they know had experienced antibiotic resistance.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"font-family:var(--font-heading);font-size:clamp(34px,4vw,48px);line-height:1;margin:0 0 10px;color:var(--color-accent-700)\">4.7M<\u002Fp>\n            <p style=\"font-size:15px;line-height:1.6;margin:0;color:color-mix(in srgb, var(--color-text) 80%, transparent)\">deaths worldwide were associated with bacterial resistance in 2021 alone.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"font-family:var(--font-heading);font-size:clamp(34px,4vw,48px);line-height:1;margin:0 0 10px;color:var(--color-accent-700)\">Almost none<\u002Fp>\n            <p style=\"font-size:15px;line-height:1.6;margin:0;color:color-mix(in srgb, var(--color-text) 80%, transparent)\">of the research done in British Columbia has asked patients themselves what this is like. That’s the gap we’re trying to close.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"max-width:1180px;margin:0 auto;padding:clamp(32px,5vw,64px) clamp(20px,5vw,72px)\">\n      <h2 style=\"font-family:var(--font-heading);font-size:clamp(26px,3vw,38px);line-height:1.15;margin:0 0 8px;max-width:24ch;text-wrap:balance\">The parts we want to hear about<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.65;max-width:58ch;margin:0 0 clamp(28px,4vw,44px);color:color-mix(in srgb, var(--color-text) 72%, transparent)\">Every one of these came out of interviews other researchers have published with patients, caregivers, nurses and doctors. If something here is familiar, or if the thing that mattered most to you isn’t on the list at all, that’s exactly what we’d like to know.<\u002Fp>\n      <ul style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:clamp(22px,3vw,40px) clamp(28px,4vw,64px)\">\n        <li style=\"display:grid;grid-template-columns:16px 1fr;gap:14px;align-items:start\">\n          <span aria-hidden=\"true\" style=\"width:16px;height:16px;border-radius:50%;background:var(--color-accent);margin-top:5px\"><\u002Fspan>\n          <span><strong style=\"font-weight:700;font-size:16px\">Feeling contaminated<\u002Fstrong><br><span style=\"font-size:15.5px;line-height:1.65;color:color-mix(in srgb, var(--color-text) 78%, transparent)\">Patients in these studies used words like dirty and ashamed. Gowns and gloves protect people, and they also send a message.<\u002Fspan><\u002Fspan>\n        <\u002Fli>\n        <li style=\"display:grid;grid-template-columns:16px 1fr;gap:14px;align-items:start\">\n          <span aria-hidden=\"true\" style=\"width:16px;height:16px;border-radius:50%;background:var(--color-accent-2-500);margin-top:5px\"><\u002Fspan>\n          <span><strong style=\"font-weight:700;font-size:16px\">Visitors who don’t come<\u002Fstrong><br><span style=\"font-size:15.5px;line-height:1.65;color:color-mix(in srgb, var(--color-text) 78%, transparent)\">Staff have described family and friends staying away from isolated patients because they were frightened of catching something.<\u002Fspan><\u002Fspan>\n        <\u002Fli>\n        <li style=\"display:grid;grid-template-columns:16px 1fr;gap:14px;align-items:start\">\n          <span aria-hidden=\"true\" style=\"width:16px;height:16px;border-radius:50%;background:var(--color-accent);margin-top:5px\"><\u002Fspan>\n          <span><strong style=\"font-weight:700;font-size:16px\">Nobody explained it<\u002Fstrong><br><span style=\"font-size:15.5px;line-height:1.65;color:color-mix(in srgb, var(--color-text) 78%, transparent)\">Some patients had never heard the term for their own condition after years of treatment. Not knowing makes everything else heavier.<\u002Fspan><\u002Fspan>\n        <\u002Fli>\n        <li style=\"display:grid;grid-template-columns:16px 1fr;gap:14px;align-items:start\">\n          <span aria-hidden=\"true\" style=\"width:16px;height:16px;border-radius:50%;background:var(--color-accent-2-500);margin-top:5px\"><\u002Fspan>\n          <span><strong style=\"font-weight:700;font-size:16px\">No one to compare notes with<\u002Fstrong><br><span style=\"font-size:15.5px;line-height:1.65;color:color-mix(in srgb, var(--color-text) 78%, transparent)\">Other long illnesses have communities and support groups. Resistant infections mostly don’t, so people carry it privately.<\u002Fspan><\u002Fspan>\n        <\u002Fli>\n        <li style=\"display:grid;grid-template-columns:16px 1fr;gap:14px;align-items:start\">\n          <span aria-hidden=\"true\" style=\"width:16px;height:16px;border-radius:50%;background:var(--color-accent);margin-top:5px\"><\u002Fspan>\n          <span><strong style=\"font-weight:700;font-size:16px\">What it costs to keep going<\u002Fstrong><br><span style=\"font-size:15.5px;line-height:1.65;color:color-mix(in srgb, var(--color-text) 78%, transparent)\">Repeat appointments, travel from out of town, unpaid days, prescriptions. For some people the barrier is simply getting back to a doctor.<\u002Fspan><\u002Fspan>\n        <\u002Fli>\n        <li style=\"display:grid;grid-template-columns:16px 1fr;gap:14px;align-items:start\">\n          <span aria-hidden=\"true\" style=\"width:16px;height:16px;border-radius:50%;background:var(--color-accent-2-500);margin-top:5px\"><\u002Fspan>\n          <span><strong style=\"font-weight:700;font-size:16px\">Not knowing if it’s over<\u002Fstrong><br><span style=\"font-size:15.5px;line-height:1.65;color:color-mix(in srgb, var(--color-text) 78%, transparent)\">Whether it comes back, whether the next drug works, whether you’re still carrying something. That uncertainty is its own long illness.<\u002Fspan><\u002Fspan>\n        <\u002Fli>\n      <\u002Ful>\n      <p style=\"font-size:15.5px;line-height:1.7;margin:clamp(26px,3vw,40px) 0 0;max-width:62ch;color:color-mix(in srgb, var(--color-text) 78%, transparent)\">This isn’t only patients. Nurses and doctors interviewed in the same research described frustration, guilt and helplessness of their own, caught between the precautions that keep a ward safe and what those precautions do to the person inside the room. Caregivers rarely get asked about any of it. If that’s you, we want to hear from you too.<\u002Fp>\n    <\u002Fsection>\n\n    <section style=\"max-width:1180px;margin:0 auto;padding:clamp(32px,5vw,64px) clamp(20px,5vw,72px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(28px,5vw,72px);align-items:center\">\n      <div>\n        <h2 style=\"font-family:var(--font-heading);font-size:clamp(26px,3vw,38px);line-height:1.15;margin:0 0 16px;max-width:18ch;text-wrap:balance\">Who’s asking<\u002Fh2>\n        <p style=\"font-size:16px;line-height:1.7;margin:0 0 14px;max-width:52ch;color:color-mix(in srgb, var(--color-text) 82%, transparent)\">We’re the Human Practices subteam of iGEM UBC: six undergraduates working alongside a synthetic biology project on antimicrobial resistance. Our job on the team is the human half: making sure what gets built in the lab answers something people actually need.<\u002Fp>\n        <p style=\"font-size:16px;line-height:1.7;margin:0 0 22px;max-width:52ch;color:color-mix(in srgb, var(--color-text) 82%, transparent)\">We are students, not clinicians. We can’t give medical advice or comment on your care, but we can listen carefully, and we can carry what we hear into work that clinicians and researchers will read.<\u002Fp>\n        <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goTeam }}\" style=\"padding:11px 22px;font-size:15px\">Meet the six of us<\u002Fbutton>\n      <\u002Fdiv>\n      <figure class=\"washed\" style=\"margin:0;border-radius:56px;overflow:hidden;justify-self:end;width:min(440px,100%)\">\n        <image-slot id=\"overview-team\" shape=\"rect\" style=\"width:100%;aspect-ratio:4/3\" placeholder=\"Drop a photo of the team or campus\" src=\"d85c6153-b81a-4203-b7f1-0c67576411e8\"><\u002Fimage-slot>\n      <\u002Ffigure>\n    <\u002Fsection>\n\n    <section style=\"max-width:1180px;margin:0 auto;padding:clamp(24px,4vw,48px) clamp(20px,5vw,72px) clamp(56px,8vw,104px)\">\n      <div style=\"background:var(--color-accent-2-100);border-radius:56px;padding:clamp(32px,5vw,56px) clamp(24px,4vw,60px)\">\n        <h2 style=\"font-family:var(--font-heading);font-size:clamp(24px,2.6vw,32px);line-height:1.2;margin:0 0 14px;max-width:24ch;text-wrap:balance\">There are four ways to take part, and one of them takes ten minutes<\u002Fh2>\n        <p style=\"font-size:16px;line-height:1.7;margin:0 0 26px;max-width:56ch;color:color-mix(in srgb, var(--color-text) 82%, transparent)\">A short anonymous survey, a one-to-one conversation, a written story in your own words, or nothing at all for now. Just tell us you’re interested and we’ll keep you posted. You can stop at any point, and you never have to answer a question you’d rather not.<\u002Fp>\n        <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ goContact }}\" style=\"padding:12px 24px;font-size:15px\">Get in touch<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isGoals }}\" hint-placeholder-val=\"{{ true }}\">\n  <main>\n    <section style=\"max-width:1180px;margin:0 auto;padding:clamp(44px,6vw,84px) clamp(20px,5vw,72px) clamp(24px,4vw,48px)\">\n      <h1 style=\"font-family:var(--font-heading);font-size:clamp(34px,4.6vw,58px);line-height:1.1;letter-spacing:-0.02em;margin:0 0 24px;max-width:20ch;text-wrap:balance\">What we’re doing, and why<\u002Fh1>\n      <p style=\"font-size:18px;line-height:1.65;max-width:58ch;margin:0;color:color-mix(in srgb, var(--color-text) 84%, transparent)\">Three stages, in order. The literature search is finished; we’re at the start of the second one, which is where you come in.<\u002Fp>\n    <\u002Fsection>\n\n    <section style=\"max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,72px) clamp(24px,4vw,48px)\">\n      <article style=\"display:grid;grid-template-columns:minmax(0,3fr) minmax(0,5fr);gap:clamp(20px,4vw,64px);padding:clamp(28px,4vw,44px) 0;border-top:1px solid var(--color-divider)\">\n        <div>\n          <span style=\"display:block;font-family:var(--font-heading);font-size:15px;color:var(--color-accent-700);margin-bottom:10px\">01<\u002Fspan>\n          <h2 style=\"font-family:var(--font-heading);font-size:clamp(24px,2.6vw,32px);line-height:1.18;margin:0;max-width:16ch;text-wrap:balance\">The problem<\u002Fh2>\n        <\u002Fdiv>\n        <div>\n          <p style=\"font-size:16.5px;line-height:1.7;margin:0 0 18px;max-width:60ch;color:color-mix(in srgb, var(--color-text) 84%, transparent)\">Antimicrobial resistance is usually counted: prescriptions written, resistant samples, days in hospital, dollars. British Columbia has some of the best of that data anywhere: nineteen years of it, fifty-one million prescriptions, a stewardship programme that cut antibiotic use in small children by more than half. It is genuinely good work, and it describes an organism rather than a person.<\u002Fp>\n          <p style=\"font-size:16.5px;line-height:1.7;margin:0 0 18px;max-width:60ch;color:color-mix(in srgb, var(--color-text) 84%, transparent)\">We spent this spring reading everything we could find on the other side of it, and three things stood out. Most of what exists comes from hospital samples, which systematically misses the people least likely to end up in a hospital record. The studies that do ask patients directly are small, scattered across different countries and different infections, and almost none of them are from BC. And the same barriers keep surfacing in all of them anyway: shame, isolation, silence, cost, and the plain fact that nobody explained the diagnosis.<\u002Fp>\n          <p style=\"font-size:16.5px;line-height:1.7;margin:0;max-width:60ch;color:color-mix(in srgb, var(--color-text) 84%, transparent)\">The burden also falls unevenly. Our review kept landing on the same groups: people in long-term care, people experiencing homelessness, refugees, Indigenous communities living with underfunded infrastructure, cancer patients, newborns, and the healthcare workers alongside them. Resistance follows the fault lines that were already there. That makes it an equity problem, not just a microbiology one.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article style=\"display:grid;grid-template-columns:minmax(0,3fr) minmax(0,5fr);gap:clamp(20px,4vw,64px);padding:clamp(28px,4vw,44px) 0;border-top:1px solid var(--color-divider)\">\n        <div>\n          <span style=\"display:block;font-family:var(--font-heading);font-size:15px;color:var(--color-accent-700);margin-bottom:10px\">02<\u002Fspan>\n          <h2 style=\"font-family:var(--font-heading);font-size:clamp(24px,2.6vw,32px);line-height:1.18;margin:0;max-width:16ch;text-wrap:balance\">What we’re doing<\u002Fh2>\n        <\u002Fdiv>\n        <div>\n          <p style=\"font-size:16.5px;line-height:1.7;margin:0 0 22px;max-width:60ch;color:color-mix(in srgb, var(--color-text) 84%, transparent)\">The reading is done, and we’ve been learning from people who know this from the inside. Dr. Bob Hancock, Canada Research Chair in Health and Genomics at UBC, walked us through the science and where public understanding of it falls short. Dr. Richard Lester, an infectious disease physician, showed us how this looks from the clinic. And Sunny Loo, who lives with vasculitis and long-term antibiotic dependency and is a patient partner on the BC Antimicrobial Stewardship Program, has been shaping what we ask, and how we ask it. Now we’re going to the people the papers are about.<\u002Fp>\n          <ul style=\"list-style:none;margin:0 0 18px;padding:0;display:grid;gap:16px\">\n            <li style=\"display:grid;grid-template-columns:14px 1fr;gap:14px;align-items:start\"><span aria-hidden=\"true\" style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);margin-top:6px\"><\u002Fspan><span style=\"font-size:16px;line-height:1.65;color:color-mix(in srgb, var(--color-text) 84%, transparent)\"><strong style=\"font-weight:700\">Ask the people it happened to.<\u002Fstrong> Surveys, one-to-one interviews and written accounts, from patients, from the family and friends who looked after them, and from the nurses and physicians who treat these infections in BC.<\u002Fspan><\u002Fli>\n            <li style=\"display:grid;grid-template-columns:14px 1fr;gap:14px;align-items:start\"><span aria-hidden=\"true\" style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent-2-500);margin-top:6px\"><\u002Fspan><span style=\"font-size:16px;line-height:1.65;color:color-mix(in srgb, var(--color-text) 84%, transparent)\"><strong style=\"font-weight:700\">Name the barriers, in their words.<\u002Fstrong> Turn what we hear into an honest map of the psychosocial barriers people actually run into, starting from what exists in each community rather than what it lacks.<\u002Fspan><\u002Fli>\n            <li style=\"display:grid;grid-template-columns:14px 1fr;gap:14px;align-items:start\"><span aria-hidden=\"true\" style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);margin-top:6px\"><\u002Fspan><span style=\"font-size:16px;line-height:1.65;color:color-mix(in srgb, var(--color-text) 84%, transparent)\"><strong style=\"font-weight:700\">Fix the explaining problem.<\u002Fstrong> With UBC Geering Up we’re building AMR teaching for school-age students, and we publish patient and clinician interviews on our social channels, because “nobody told me” came up too often to ignore.<\u002Fspan><\u002Fli>\n            <li style=\"display:grid;grid-template-columns:14px 1fr;gap:14px;align-items:start\"><span aria-hidden=\"true\" style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent-2-500);margin-top:6px\"><\u002Fspan><span style=\"font-size:16px;line-height:1.65;color:color-mix(in srgb, var(--color-text) 84%, transparent)\"><strong style=\"font-weight:700\">Take it back to the bench.<\u002Fstrong> Use the map to steer our own team’s laboratory work, and publish the whole thing in plain language, free to read, for patients as well as researchers.<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article style=\"display:grid;grid-template-columns:minmax(0,3fr) minmax(0,5fr);gap:clamp(20px,4vw,64px);padding:clamp(28px,4vw,44px) 0;border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider)\">\n        <div>\n          <span style=\"display:block;font-family:var(--font-heading);font-size:15px;color:var(--color-accent-700);margin-bottom:10px\">03<\u002Fspan>\n          <h2 style=\"font-family:var(--font-heading);font-size:clamp(24px,2.6vw,32px);line-height:1.18;margin:0;max-width:16ch;text-wrap:balance\">What we hope changes<\u002Fh2>\n        <\u002Fdiv>\n        <div>\n          <p style=\"font-size:16.5px;line-height:1.7;margin:0 0 18px;max-width:60ch;color:color-mix(in srgb, var(--color-text) 84%, transparent)\">That a patient with a resistant infection gets asked how they’re coping, not only how the wound looks. That nobody spends a week in an isolation room without being told why, in words they can use with their own family. That BC has patient-side evidence at all, so the next strategy written here can be built for the people it lands hardest on, rather than around them. And that the next team of students designing something for AMR starts by reading what patients said, because it exists and it’s easy to find.<\u002Fp>\n          <p style=\"font-size:16.5px;line-height:1.7;margin:0;max-width:60ch;color:color-mix(in srgb, var(--color-text) 84%, transparent)\">We’re one undergraduate team with one season. We’re not going to fix this. We can make the human side of it harder to overlook.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fsection>\n\n    <section style=\"max-width:1180px;margin:0 auto;padding:clamp(32px,5vw,56px) clamp(20px,5vw,72px) clamp(56px,8vw,104px)\">\n      <div style=\"background:var(--color-accent-100);border-radius:56px;padding:clamp(32px,5vw,56px) clamp(24px,4vw,60px)\">\n        <h2 style=\"font-family:var(--font-heading);font-size:clamp(24px,2.6vw,32px);line-height:1.2;margin:0 0 14px;max-width:26ch;text-wrap:balance\">Stage two only works if people talk to us<\u002Fh2>\n        <p style=\"font-size:16px;line-height:1.7;margin:0 0 26px;max-width:56ch;color:color-mix(in srgb, var(--color-text) 84%, transparent)\">Everything above depends on hearing from people who have lived it. If you have, ten minutes of your time changes what we’re able to say.<\u002Fp>\n        <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ goContact }}\" style=\"padding:12px 24px;font-size:15px\">Share your experience<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isStories }}\" hint-placeholder-val=\"{{ true }}\">\n  <main>\n    <section style=\"max-width:1180px;margin:0 auto;padding:clamp(44px,6vw,84px) clamp(20px,5vw,72px) clamp(24px,4vw,48px)\">\n      <h1 style=\"font-family:var(--font-heading);font-size:clamp(34px,4.6vw,58px);line-height:1.1;letter-spacing:-0.02em;margin:0 0 24px;max-width:20ch;text-wrap:balance\">In their own words<\u002Fh1>\n      <p style=\"font-size:18px;line-height:1.65;max-width:60ch;margin:0;color:color-mix(in srgb, var(--color-text) 84%, transparent)\">Short accounts from people living with resistant infections, and from the families, caregivers and clinicians around them. Read them, and if something here resonates you can leave a note underneath.<\u002Fp>\n      <p style=\"font-size:13.5px;line-height:1.6;margin:16px 0 0;max-width:60ch;padding:14px 18px;border-radius:24px;background:var(--color-accent-100);color:var(--color-accent-800)\">Placeholder stories for now — real accounts will replace these as we gather them. Comments are a live preview only: they are not saved anywhere yet and clear when you refresh the page.<\u002Fp>\n    <\u002Fsection>\n\n    <section style=\"max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,72px) clamp(56px,8vw,104px);display:grid;gap:clamp(24px,3vw,40px)\">\n      <sc-for list=\"{{ stories }}\" as=\"story\">\n      <article style=\"background:var(--color-surface);border-radius:44px;padding:clamp(28px,4vw,44px)\">\n        <sc-if value=\"{{ story.isShort }}\">\n        <blockquote style=\"font-family:var(--font-heading);font-size:clamp(20px,2.2vw,26px);line-height:1.35;margin:0;max-width:52ch;text-wrap:balance;color:color-mix(in srgb, var(--color-text) 92%, transparent)\">“{{ story.quote }}”<\u002Fblockquote>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ story.isLong }}\">\n        <h2 style=\"font-family:var(--font-heading);font-size:clamp(21px,2.2vw,27px);line-height:1.22;margin:0 0 16px;max-width:32ch;text-wrap:balance\">{{ story.title }}<\u002Fh2>\n        <sc-if value=\"{{ story.showPreview }}\">\n        <div style=\"max-width:64ch\">\n          <p style=\"font-size:16px;line-height:1.72;margin:0;color:color-mix(in srgb, var(--color-text) 84%, transparent)\">{{ story.preview }}<\u002Fp>\n          <button type=\"button\" onClick=\"{{ story.onExpand }}\" style=\"margin-top:14px;background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--color-accent-700)\" style-hover=\"color:var(--color-accent-800)\">{{ story.expandLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ story.showFull }}\">\n        <div style=\"max-width:64ch\">\n          <div style=\"display:grid;gap:14px\">\n            <sc-for list=\"{{ story.paragraphs }}\" as=\"para\">\n            <p style=\"font-size:16px;line-height:1.72;margin:0;color:color-mix(in srgb, var(--color-text) 84%, transparent)\">{{ para }}<\u002Fp>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ story.canCollapse }}\">\n          <button type=\"button\" onClick=\"{{ story.onExpand }}\" style=\"margin-top:14px;background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--color-accent-700)\" style-hover=\"color:var(--color-accent-800)\">{{ story.expandLabel }}<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n        <\u002Fsc-if>\n        <p style=\"font-size:14.5px;line-height:1.5;margin:16px 0 0;color:var(--color-accent-700)\">— {{ story.name }} · {{ story.context }}<\u002Fp>\n\n        <div style=\"margin-top:clamp(18px,2.4vw,26px);border-top:1px solid var(--color-divider);padding-top:14px\">\n          <button type=\"button\" onClick=\"{{ story.onToggle }}\" style=\"background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-body);font-size:13px;font-weight:600;letter-spacing:0.01em;color:color-mix(in srgb, var(--color-text) 52%, transparent)\" style-hover=\"color:var(--color-accent-700)\">{{ story.toggleLabel }}<\u002Fbutton>\n          <sc-if value=\"{{ story.open }}\">\n          <div style=\"margin-top:16px\">\n            <ul style=\"list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px\">\n              <sc-for list=\"{{ story.comments }}\" as=\"c\">\n              <li style=\"border-left:2px solid var(--color-divider);padding:2px 0 2px 14px\">\n                <p style=\"font-size:12px;font-weight:700;margin:0 0 2px;letter-spacing:0.01em;color:color-mix(in srgb, var(--color-text) 60%, transparent)\">{{ c.author }}<\u002Fp>\n                <p style=\"font-size:14px;line-height:1.55;margin:0;color:color-mix(in srgb, var(--color-text) 82%, transparent)\">{{ c.text }}<\u002Fp>\n              <\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n            <form onSubmit=\"{{ story.onPost }}\" style=\"display:grid;gap:8px;max-width:460px\">\n              <input class=\"input\" type=\"text\" value=\"{{ story.draftName }}\" onChange=\"{{ story.onDraftName }}\" placeholder=\"Your name (optional)\" style=\"font-size:14px\">\n              <textarea class=\"input\" rows=\"2\" value=\"{{ story.draftText }}\" onChange=\"{{ story.onDraftText }}\" placeholder=\"Leave a supportive comment…\" style=\"border-radius:16px;padding:10px 14px;font-size:14px\"><\u002Ftextarea>\n              <div>\n                <button type=\"submit\" class=\"btn btn-secondary\" style=\"padding:8px 18px;font-size:13.5px\">Post comment<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fform>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isTeam }}\" hint-placeholder-val=\"{{ true }}\">\n  <main>\n<section style=\"max-width: 1180px; margin: 0 auto; padding: clamp(44px,6vw,84px) clamp(20px,5vw,72px) clamp(28px,4vw,56px); position: relative\">\n      <h1 style=\"font-family:var(--font-heading);font-size:clamp(34px,4.6vw,58px);line-height:1.1;letter-spacing:-0.02em;margin:0 0 24px;max-width:18ch;text-wrap:balance\">The six people reading your story<\u002Fh1>\n      <p style=\"font-size:18px;line-height:1.65;max-width:58ch;margin:0;color:color-mix(in srgb, var(--color-text) 84%, transparent)\">We’re the Human Practices subteam of iGEM UBC. If you write to us, one of us answers. There’s no inbox in between.<\u002Fp>\n<\u002Fsection>\n\n    <section style=\"max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,72px) clamp(32px,5vw,56px)\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:clamp(32px,4vw,56px) clamp(24px,3vw,44px)\">\n        <div>\n          <div class=\"washed\" style=\"width:100%;max-width:210px;aspect-ratio:1;border-radius:{{ photoRadius }};overflow:hidden;margin-bottom:18px\">\n            <image-slot id=\"team-1\" shape=\"rect\" style=\"width:100%;height:100%\" placeholder=\"Photo\" src=\"b63c8455-f5ad-4df9-ad9e-5d73d21c397c\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <h3 style=\"font-family:var(--font-heading);font-size:20px;line-height:1.25;margin:0 0 8px\">Zahra Savoji<\u002Fh3>\n          <p style=\"font-size:13.5px;line-height:1.4;margin:0 0 10px;color:var(--color-accent-700)\">Third-year neuroscience<\u002Fp><p style=\"font-size:15px;line-height:1.65;margin:0;max-width:34ch;color:color-mix(in srgb, var(--color-text) 78%, transparent)\">This project is invaluable for me because of my deep passion in connecting with patients meaningfully in ways that provide them with compassionate and inclusive care.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div class=\"washed\" style=\"width:100%;max-width:210px;aspect-ratio:1;border-radius:{{ photoRadius }};overflow:hidden;margin-bottom:18px\">\n            <image-slot id=\"team-2\" shape=\"rect\" style=\"width:100%;height:100%\" placeholder=\"Photo\" src=\"f0870eb6-c292-4779-bb70-869f47ba03f7\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <h3 style=\"font-family:var(--font-heading);font-size:20px;line-height:1.25;margin:0 0 8px\">Ali Mohammad Yazdani<\u002Fh3>\n          <p style=\"font-size:13.5px;line-height:1.4;margin:0 0 10px;color:var(--color-accent-700)\">Year and major<\u002Fp><p style=\"font-size:15px;line-height:1.65;margin:0;max-width:34ch;color:color-mix(in srgb, var(--color-text) 78%, transparent)\">One honest line about why this project matters to them.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div class=\"washed\" style=\"width:100%;max-width:210px;aspect-ratio:1;border-radius:{{ photoRadius }};overflow:hidden;margin-bottom:18px\">\n            <image-slot id=\"team-3\" shape=\"rect\" style=\"width:100%;height:100%\" placeholder=\"Photo\" src=\"7ecbcb5b-a966-4f42-8627-de1f5617cae3\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <h3 style=\"font-family:var(--font-heading);font-size:20px;line-height:1.25;margin:0 0 8px\">Julia Kim<\u002Fh3>\n          <p style=\"font-size:13.5px;line-height:1.4;margin:0 0 10px;color:var(--color-accent-700)\">Second-year neuroscience<br><\u002Fp><p style=\"font-size:15px;line-height:1.65;margin:0;max-width:34ch;color:color-mix(in srgb, var(--color-text) 78%, transparent)\">Having grown up across different countries, I've seen firsthand how healthcare access and communication vary wildly depending on where you are, which is why inclusive, patient-centered research matters so much to me.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div class=\"washed\" style=\"width:100%;max-width:210px;aspect-ratio:1;border-radius:{{ photoRadius }};overflow:hidden;margin-bottom:18px\">\n            <image-slot id=\"team-4\" shape=\"rect\" style=\"width:100%;height:100%\" placeholder=\"Photo\" src=\"9a9fd714-e18e-4575-9b99-ba70f5ea4e80\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <h3 style=\"font-family:var(--font-heading);font-size:20px;line-height:1.25;margin:0 0 8px\">Daniel Rostin<\u002Fh3>\n          <p style=\"font-size:13.5px;line-height:1.4;margin:0 0 10px;color:var(--color-accent-700)\">Second-year pharmaceutical sciences<\u002Fp><p style=\"font-size:15px;line-height:1.65;margin:0;max-width:34ch;color:color-mix(in srgb, var(--color-text) 78%, transparent)\">This project is important to me because it combines scientific innovation with education and raising awareness about antimicrobial resistance, showing the importance of patient-centred research.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div class=\"washed\" style=\"width:100%;max-width:210px;aspect-ratio:1;border-radius:{{ photoRadius }};overflow:hidden;margin-bottom:18px\">\n            <image-slot id=\"team-5\" shape=\"rect\" style=\"width:100%;height:100%\" placeholder=\"Photo\" src=\"8cee5985-2371-4e2d-bf29-8cb23be24e25\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <h3 style=\"font-family:var(--font-heading);font-size:20px;line-height:1.25;margin:0 0 8px\">Rachael Zhang<\u002Fh3>\n          <p style=\"font-size:13.5px;line-height:1.4;margin:0 0 10px;color:var(--color-accent-700)\">Third-year microbiology and immunology<\u002Fp><p style=\"font-size:15px;line-height:1.65;margin:0;max-width:34ch;color:color-mix(in srgb, var(--color-text) 78%, transparent)\">This project is important to me because I believe empowering young people with knowledge about AMR and equitable access to care can create a lasting impact on our community.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div class=\"washed\" style=\"width:100%;max-width:210px;aspect-ratio:1;border-radius:{{ photoRadius }};overflow:hidden;margin-bottom:18px\">\n            <image-slot id=\"team-6\" shape=\"rect\" style=\"width:100%;height:100%\" placeholder=\"Photo\" src=\"d645802d-9558-41c9-84de-4cfe2b1129f9\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <h3 style=\"font-family:var(--font-heading);font-size:20px;line-height:1.25;margin:0 0 8px\">Denzel Hu<\u002Fh3>\n          <p style=\"font-size:13.5px;line-height:1.4;margin:0 0 10px;color:var(--color-accent-700)\">Fourth-year microbiology and immunology<\u002Fp><p style=\"font-size:15px;line-height:1.65;margin:0;max-width:34ch;color:color-mix(in srgb, var(--color-text) 78%, transparent)\">As a child of immigrants who struggled to navigate a foreign healthcare system, access to healthcare holds profound meaning to me. iGEM's HP team brings an amazing opportunity to give care to those who need it.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,72px) clamp(56px,8vw,104px)\">\n      <div style=\"background:var(--color-accent-2-100);border-radius:56px;padding:clamp(32px,5vw,56px) clamp(24px,4vw,60px)\">\n        <div style=\"margin:0 0 clamp(24px,3vw,36px)\">\n          <h2 style=\"font-family:var(--font-heading);font-size:clamp(22px,2.4vw,29px);line-height:1.2;margin:0 0 12px;max-width:22ch;text-wrap:balance\">iGEM, in one paragraph<\u002Fh2>\n          <p style=\"font-size:16px;line-height:1.7;margin:0;max-width:54ch;color:color-mix(in srgb, var(--color-text) 84%, transparent)\">iGEM is an international competition where student teams spend a year building something in synthetic biology. Every team has a Human Practices group whose job is to ask whether the thing being built is actually wanted, and by whom. That’s us.<\u002Fp>\n        <\u002Fdiv>\n        <figure style=\"margin:0\">\n          <div class=\"washed\" style=\"border-radius:32px;overflow:hidden\">\n            <img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wgARCAIOBmADASIAAhEBAxEB/8QAGwAAAwEBAQEBAAAAAAAAAAAABAUGAwIHAQD/xAAaAQADAQEBAQAAAAAAAAAAAAABAgMEAAUG/9oADAMBAAIQAxAAAAGIy1yiCG6Sw2GadL2zmS/HK4jnfDePdkj/AJec6NzzyRo2CJk1NYwHQthMFvxvPz6pHpJprNhWOBKtPN9tAQvu+gOBHWyNnP0ULdLDOWYkCiOSyBgdSQ26Y3TuFPm7JSFuuB4bNRdxo4GoR+kozS1lENwHbToNjpgRtpgQeRtxi04YsLcMdgi1ddDRMzzT4cOnKtNciWI5sgootDsry4/EZh0VdHOyGC/7h02r6LKnb6PuIy/j0TUHopaWO5wQEtz0PkgH7kx2UJD+Pp5p8VOFPH5AcDo9nxySyxlTI8DUldxyWjTFtJqsm3Vh9QUDTpBEBEmZNMN0bjZYX3fC0W7gj9NPww7CXZDj+ERnGhETbFS/hO7dghqJIjXrLpSvcIasEQoEqaAvh+xTjHk1+kjj9m5cC42IA5OGbOLjgX1/xaogjHBqKybfnkrN1dCTo
